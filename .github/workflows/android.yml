# Bouwt de Android-app.
#
#   push en pull request   tests, daarna een test-APK als artefact bij de run.
#                          Die heet "Suikerwater (test)" en heeft een eigen
#                          pakketnaam, dus hij staat naast de echte app en kan
#                          die nooit overschrijven.
#   tag v1.2.3             dezelfde tests, daarna de echte APK, ondertekend met
#                          de vaste sleutel, als GitHub-release. Die download je
#                          op je telefoon.
#
# Alleen de release-job krijgt de ondertekensleutel. Daarom gebruikt die zo min
# mogelijk acties van anderen, en staan alle acties vast op een commit (versie
# als commentaar erachter): een tag kan worden verplaatst, een commit niet.

name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Een nieuwere push maakt een lopende testbuild overbodig; een release niet.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test-APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version-name: ${{ steps.version.outputs.name }}
      version-code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Berekening testen
        run: node test/calc.test.mjs

      - name: Versie bepalen
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Tag $GITHUB_REF_NAME is geen vX.Y.Z"
              exit 1
            fi
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
            # versionCode = XXYYZZ; dan moet elke update een hoger getal geven.
            if (( 10#$minor > 99 || 10#$patch > 99 )); then
              echo "::error::Minor en patch mogen hoogstens 99 zijn"
              exit 1
            fi
            code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))
          else
            name="0.0.0-${GITHUB_RUN_NUMBER}"
            code=0
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Versie $name (releasecode $code)"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          # Standaard kijkt setup-java alleen naar gradle/ in de hoofdmap; het
          # project staat in android/, met de versies in libs.versions.toml.
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle.properties
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      # Een testbuild krijgt altijd het runnummer als versiecode, ook bij een
      # tag: dat loopt alleen maar op. Met de releasecode (10203) zou elke
      # latere testbuild als een downgrade worden geweigerd.
      - name: Test-APK bouwen
        working-directory: android
        run: >-
          ./gradlew assembleDebug
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suikerwater-test-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version-name }}
      VERSION_CODE: ${{ needs.build.outputs.version-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bewust zonder Gradle-cache: een release bouwt alles vers op, zodat er
      # niets uit een eerdere (test)build in de ondertekende APK kan belanden.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Sleutel klaarzetten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Het geheim ANDROID_KEYSTORE_BASE64 ontbreekt; zie de README."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          echo "SUIKERWATER_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Release-APK bouwen
        working-directory: android
        env:
          SUIKERWATER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SUIKERWATER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SUIKERWATER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Zonder configuration cache: die zou de wachtwoorden hierboven in de
        # cache van de build vastleggen.
        run: >-
          ./gradlew --no-configuration-cache --no-build-cache assembleRelease
          -PappVersionName=$VERSION
          -PappVersionCode=$VERSION_CODE

      - name: Handtekening controleren
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "suikerwater-$VERSION.apk"
          sha256sum "suikerwater-$VERSION.apk" > "suikerwater-$VERSION.apk.sha256"

      - name: Release maken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Installeren op je telefoon

          1. Open deze pagina in Chrome op je telefoon en tik op **suikerwater-$VERSION.apk**.
          2. Android vraagt of Chrome apps mag installeren. Sta dat toe voor Chrome.
          3. Tik op **Installeren**.

          Heb je Suikerwater al? Dan wordt hij bijgewerkt en blijft je invoer staan.

          De app vraagt geen enkele permissie, ook geen internet.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "suikerwater-$VERSION.apk" "suikerwater-$VERSION.apk.sha256" \
            --title "Suikerwater $VERSION" --notes-file notes.md --verify-tag

      - name: Sleutel opruimen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
